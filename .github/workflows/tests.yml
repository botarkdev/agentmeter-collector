# Formatting, types, the unit suite under coverage, the build and the packed artefact, on every
# pull request and on every push to `main`.
#
# It holds no write permission, runs on no schedule and publishes nothing: `release.yml` is the
# workflow that publishes, and it runs these same checks first.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Types
        run: pnpm typecheck

      - name: Unit tests, with coverage
        run: pnpm test:cov

      - name: Build
        run: pnpm build

      # The artefact, not the sources: packs it as a release does, installs it from the tarball
      # alone and runs the installed binary (scripts/check-package.mjs).
      - name: Package
        run: pnpm check:package
